name: Renderer regression tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --ignore-scripts
      - run: >-
          bunx --no-install mocha --no-config --require ./scripts/init-test-env.js
          'packages/gerber-parser/test/*test.js'
          'packages/gerber-plotter/test/*test.js'
          'packages/gerber-to-svg/test/*test.js'
